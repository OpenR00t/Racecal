# Racecal configuration
#
# Each [[series]] block is one championship:
#
#   name      short label used as the event title prefix
#   source    where the schedule comes from:
#               "sportstimes"  github.com/sportstimes/f1 data; needs `key`
#                              (f1, indycar, f2, f3, fe, motogp, f1-academy)
#               "fiawec"       the official FIA WEC website
#               "thesportsdb"  TheSportsDB free API; needs `league` (id)
#               "fia"          an fia.com championship calendar (event dates
#                              only); needs `championship` (the URL part
#                              after /events/)
#               "scoreraceinfo" SCORE desert races (score-raceinfo.com)
#               "kingofthehammers" King of the Hammers race-week schedule
#   group     true  = collapse every session of a round into ONE event
#                     (start = first session, end = last session)
#             false = one calendar event per session
#   include   optional regexes matched against each session's label
#             ("Practice 1", "Qualifying", "Race", ...); a session is kept
#             only if one matches (case-insensitive)
#   exclude   optional regexes; matching sessions are dropped
#   duration  session length in minutes when nothing better is known
#   durations optional [{ pattern, minutes }] overrides by session label
#
#   race_hours optional { "<regex on event name>" = hours } for races
#             whose name doesn't say how long they are
#
# Races named "<N> Hours of ..." last N hours unless `durations` says
# otherwise. TheSportsDB-only options:
#   group_by  "season" groups a whole season instead of each round
#   listing   "season" fetches a season in one request (only for series
#             with fewer than 15 events a season)
#   strip     regexes removed from session names to get the event name
#   title     fixed event title for grouped series; {season} is filled in

[settings]
# Time zone used for the session list written into event descriptions.
# Calendar apps always show the event itself in your local time.
timezone = "UTC"
# Seasons to fetch, relative to the current year (0 = this year).
seasons = [0, 1]
output = "public/racecal.ics"
calendar_name = "Racecal"
# Stop making requests after this many minutes and build from stored data.
time_budget_minutes = 20

[[series]]
name = "F1"
source = "sportstimes"
key = "f1"
name_suffix = " Grand Prix"
group = false

[[series]]
name = "IndyCar"
source = "sportstimes"
key = "indycar"
group = false
durations = [{ pattern = "^Race$", minutes = 150 }]

[[series]]
name = "WEC"
source = "fiawec"
group = false
durations = [
  { pattern = "Practice", minutes = 90 },
  { pattern = "Hyperpole", minutes = 10 },
  { pattern = "Qualifying", minutes = 12 },
]
# Race lengths for events whose name doesn't say "<N> Hours".
race_hours = { "Lone Star" = 6, "1812" = 10 }

[[series]]
name = "DTM"
source = "thesportsdb"
league = 4438
group = false
duration = 60

[[series]]
name = "WRC"
source = "thesportsdb"
league = 4409
group = true
duration = 30
strip = ["\\s+SS\\d+.*$", "^WRC\\s+"]

[[series]]
name = "Dakar"
source = "thesportsdb"
league = 4447
group = true
group_by = "season"
listing = "season"   # one request per season (fewer than 15 stages)
title = "Dakar Rally {season}"
duration = 0

[[series]]
name = "W2RC"
source = "fia"
championship = "fia-world-rally-raid-championship"
group = false
exclude = ["Dakar"]   # comes from the Dakar block above, with stage days

[[series]]
name = "SCORE"
source = "scoreraceinfo"
group = false

[[series]]
name = "KOH"
source = "kingofthehammers"
group = false
# Races only: drop gates, registration, meetings, awards, power hours and
# the youth race.
exclude = ["Gates", "Registration", "Check-In", "Meeting", "Awards",
           "Prerunning", "POWER HOUR", "Kids"]
